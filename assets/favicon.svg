<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="MSE">
  <defs>
    <clipPath id="fRing"><circle cx="100" cy="100" r="90"/></clipPath>
    <linearGradient id="fY" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFD21A"/><stop offset="1" stop-color="#FFD21A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#12B15A"/><stop offset="1" stop-color="#12B15A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fR" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E4262B"/><stop offset="1" stop-color="#E4262B" stop-opacity="0"/>
    </linearGradient>
    <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="fTxt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#0A0B0E"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#EDEDED" stroke-width="2.6"/>

  <g clip-path="url(#fRing)" filter="url(#fSoft)">
    <polygon points="84,122 96,122 110,30 72,30" fill="url(#fY)" transform="rotate(-17 90 122)"/>
    <polygon points="94,120 106,120 120,22 80,22" fill="url(#fG)"/>
    <polygon points="104,122 116,122 130,30 92,30" fill="url(#fR)" transform="rotate(17 110 122)"/>
  </g>

  <text x="100" y="132" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-weight="bold" font-size="80" fill="#F4F4F4" stroke="#04060A" stroke-width="2"
        paint-order="stroke" letter-spacing="1" filter="url(#fTxt)">MSE</text>
</svg>
