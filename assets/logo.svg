<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="MSE — Multi Show Eventos">
  <defs>
    <clipPath id="ring"><circle cx="100" cy="100" r="90"/></clipPath>
    <linearGradient id="bY" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFD21A"/><stop offset="1" stop-color="#FFD21A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#12B15A"/><stop offset="1" stop-color="#12B15A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bR" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E4262B"/><stop offset="1" stop-color="#E4262B" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="txt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- disco -->
  <circle cx="100" cy="100" r="96" fill="#0A0B0E"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#EDEDED" stroke-width="2.4"/>

  <!-- feixes de luz (recortados pelo disco) -->
  <g clip-path="url(#ring)" filter="url(#soft)">
    <polygon points="86,120 96,120 108,34 74,34" fill="url(#bY)" transform="rotate(-17 91 120)"/>
    <polygon points="95,118 105,118 118,28 82,28" fill="url(#bG)"/>
    <polygon points="104,120 114,120 126,34 92,34" fill="url(#bR)" transform="rotate(17 109 120)"/>
  </g>

  <!-- wordmark -->
  <text x="100" y="132" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-weight="bold" font-size="58" fill="#F4F4F4" stroke="#04060A" stroke-width="1.4"
        paint-order="stroke" letter-spacing="1" filter="url(#txt)">MSE</text>
  <text x="100" y="156" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-weight="bold" font-size="12.5" fill="#F4F4F4" letter-spacing="1.2">MULTI SHOW EVENTOS</text>
</svg>
